name: One-shot autosave baseline
"on":
  push:
    branches: [ci/12002-baseline]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'ggettert/zeroclaw' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
      - name: Record environment
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
          free -h
          df -h .
          mkdir -p web/dist
          touch web/dist/.gitkeep
      - name: Run only the regression (baseline is expected to fail)
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --locked -p zeroclaw-runtime --lib agent::tests::issue_12002_autosave_preserves_turns -- --exact --test-threads=1 --nocapture 2>&1 | tee baseline.log
          status=$?
          set -e
          if [ "$status" -eq 101 ] && grep -Fq 'running 1 test' baseline.log && grep -Fq 'Both turns must remain in memory' baseline.log && grep -Fq 'test result: FAILED. 0 passed; 1 failed;' baseline.log; then
            echo 'Expected baseline failure reproduced: the real two-turn test lost an earlier message.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Baseline not confirmed. Inspect the log; compilation/setup failures are not proof of the defect.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
