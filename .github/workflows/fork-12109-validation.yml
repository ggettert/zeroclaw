      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test monthly outdated result classification
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test monthly outdated result classification
      run: bash scripts/ci/monthly_outdated_result.test.sh
    - name: Verify source after Test monthly outdated result classification
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test release tool installer mappings
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test release tool installer mappings
      run: bash scripts/ci/install_release_tool.test.sh
    - name: Verify source after Test release tool installer mappings
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test binary size safeguard
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test binary size safeguard
      run: python3 scripts/ci/check_binary_size_test.py
    - name: Verify source after Test binary size safeguard
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test crates.io publish ordering and preflight
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test crates.io publish ordering and preflight
      run: python3 scripts/release/publish_crates_test.py
    - name: Verify source after Test crates.io publish ordering and preflight
