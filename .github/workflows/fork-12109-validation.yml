name: Fork 12002 gateway autosave A-B
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-12002-live-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-live-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_TARGET_DIR: ${{ runner.temp }}/12002-target
    steps:
      - name: Checkout frozen validation harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
          submodules: false
      - name: Checkout exact baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: 69ea0ae1ae6f662ea9952e6247c764289adfe6a2
          path: baseline
          persist-credentials: false
          submodules: false
      - name: Checkout exact reviewed fix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ggettert/zeroclaw
          ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
          path: fixed
          persist-credentials: false
          submodules: false
      - name: Verify frozen source and harness
        env:
          EXPECTED_HARNESS: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS"
          test -z "$(git -C harness status --porcelain)"
          echo "harness_sha=$EXPECTED_HARNESS features=FULL_DEFAULTS toolchain=1.98.0"
          sha256sum harness/scripts/ci/12002_gateway_acceptance.py harness/scripts/ci/12002_source_manifest.json harness/.github/workflows/fork-12109-validation.yml
          python3 harness/scripts/ci/12002_verify_sources.py
          python3 -B harness/scripts/ci/12002_gateway_acceptance.py --self-test
          free -h; df -h
      - name: Install pinned required CI toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
      - name: Install existing CI Linux dependencies
        run: timeout --signal=TERM --kill-after=10s 300s bash baseline/scripts/ci/apt_install.sh mold libasound2-dev
      - name: Build and prove baseline then fixed
        run: |
          set -euo pipefail
          rustc --version; cargo --version
          mkdir -p "$RUNNER_TEMP/12002-binaries"
          for case in baseline fixed; do
            python3 harness/scripts/ci/12002_verify_sources.py
            (cd "$case" && cargo build --locked --bin zeroclaw)
            install -m 0555 "$CARGO_TARGET_DIR/debug/zeroclaw" "$RUNNER_TEMP/12002-binaries/$case"
            sha256sum "$RUNNER_TEMP/12002-binaries/$case"
            python3 harness/scripts/ci/12002_verify_sources.py
            timeout --signal=TERM --kill-after=20s 200s python3 -B harness/scripts/ci/12002_gateway_acceptance.py --case "$case" --binary "$RUNNER_TEMP/12002-binaries/$case"
          done
          echo 'ACCEPTANCE baseline=overwrite-reproduced fixed=both-retained external_llm=loopback-stub'
      - name: Final source and resource evidence
        if: always()
        run: |
          python3 harness/scripts/ci/12002_verify_sources.py
          sha256sum "$RUNNER_TEMP"/12002-binaries/* 2>/dev/null || true
          free -h; df -h
