        \ ['plugin_runtime::', 'tools::tests::shared_ceiling', 'tools::tests::repeated_loader',\n              \
        \   'tools::tests::auto_discover', 'tools::tests::colliding_plugin',\n                 'tools::tests::plugin_tls_coherence']\n\
        # The ignored tests in the whole selection must be exactly the 23: one\n# that lost its #[ignore], or another\
