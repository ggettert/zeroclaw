    - name: Test apt install timeout and retry behavior
      run: bash scripts/ci/apt_install.test.sh
    - name: Verify source after Test apt install timeout and retry behavior
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Guard release attestation contract
