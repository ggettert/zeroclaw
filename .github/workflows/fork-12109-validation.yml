name: Fork frozen registry validation
run-name: Registry parity e7543ac / ${{ inputs.stage }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Bounded validation lane
        type: choice
        required: true
        options: [linux, windows]
      target_sha:
        description: Frozen candidate commit in this fork
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fork-12216-parity-e7543ac-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ggettert/zeroclaw' && github.ref == 'refs/heads/validation/12216-parity-e7543ac-ci' && github.event_name == 'workflow_dispatch' && inputs.target_sha == 'e7543ac01e7326477217fc00e86cc8084ec1dfcc' && (inputs.stage == 'linux' || inputs.stage == 'windows')
    runs-on: ${{ inputs.stage == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      STAGE: ${{ inputs.stage }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_OFFLINE: 'true'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep checkout bytes controlled
        shell: bash
        run: |
          git config --global core.autocrlf false
          # text=auto without an explicit eol would otherwise use native CRLF on Windows.
          # Explicit attributes (including eol=crlf for PowerShell) still take precedence.
          git config --global core.eol lf
      - name: Trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ggettert/zeroclaw
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: fork-validation/12216
      - name: Frozen candidate with exact base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ggettert/zeroclaw
          ref: e7543ac01e7326477217fc00e86cc8084ec1dfcc
          path: source
          fetch-depth: 3
          persist-credentials: false
      - name: Attest exact checkout against frozen combined patch and both manifests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../tooling rev-parse HEAD)" = "$WORKFLOW_SHA"
          python ../tooling/fork-validation/12216/attest.py before
      - name: Install pinned Rust, rustfmt and native/WASI targets
        shell: bash
        env:
          RUSTUP_DIST_SERVER: https://static.rust-lang.org
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$STAGE" in
            Linux:linux) host=x86_64-unknown-linux-gnu ;;
            Windows:windows) host=x86_64-pc-windows-msvc ;;
            *) exit 1 ;;
          esac
          rustup toolchain install "1.98.0-$host" --profile minimal --no-self-update \
            --component rustfmt --target "$host" --target wasm32-wasip2
      - name: Prefetch locked dependencies for native and WASI tests
        working-directory: source
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'false'
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$STAGE" in
            Linux:linux) host=x86_64-unknown-linux-gnu ;;
            Windows:windows) host=x86_64-pc-windows-msvc ;;
            *) exit 1 ;;
          esac
          cargo +1.98.0 fetch --locked --target "$host" --target wasm32-wasip2
      - name: Pinned toolchain admission and selected regression tests
        working-directory: source
        shell: bash
        run: python ../tooling/fork-validation/12216/run.py
      - name: Verify final source bytes
        if: ${{ always() && !cancelled() }}
        working-directory: source
        shell: bash
        run: python ../tooling/fork-validation/12216/attest.py after
