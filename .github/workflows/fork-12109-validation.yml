    - name: Verify source before Golden-frame replay (informational)
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
      if: ${{ !cancelled() }}
    - name: Golden-frame replay (informational)
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: "set +e\ncargo nextest run --locked --workspace --exclude zeroclaw-desktop \\\n  --run-ignored only --no-fail-fast\
        \ \\\n  -E 'package(zeroclaw-gateway) & binary(golden_frames)' 2>&1 | tee golden-frames.log\nstatus=${PIPESTATUS[0]}\n\
        {\n  echo \"### Golden-frame replay (informational)\"\n  if [ \"$status\" -eq 0 ]; then\n    echo \"All\
        \ gateway golden-frame scenarios match their fixtures.\"\n  else\n    echo \"Gateway output drifted from\
        \ the recorded fixtures. This does not fail CI.\"\n    echo \"Re-record intended changes with \\`ZEROCLAW_GOLDEN_RECORD=1\\\
        ` (see \\`crates/zeroclaw-gateway/tests/golden_frames.rs\\`).\"\n    echo\n    echo '```text'\n    grep\
        \ -E '^\\s+(FAIL|PASS) |golden-frame mismatch|^[+-] {0,3}[0-9]+ ' golden-frames.log | head -200\n    echo\
        \ '```'\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\nif [ \"$status\" -ne 0 ]; then\n  echo \"::warning title=Golden-frame\
        \ drift::Gateway output differs from tests/golden fixtures (informational).\"\nfi\nexit \"$status\"\n"
      env:
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    - name: Verify source after Golden-frame replay (informational)
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
