name: Fork 12002 exact PR head seven tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-12002-unit-head
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-unit-head-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.98.0
      SOURCE_SHA: a1780d236088e782caaebc0a84dd4c9f19c04d2d
    steps:
      - name: Checkout this reviewed workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ggettert/zeroclaw
          ref: ${{ github.workflow_sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Checkout exact clean PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ggettert/zeroclaw
          ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify source identity and resources
        working-directory: source
        env:
          EXPECTED_HARNESS: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/harness" rev-parse HEAD)" = "$EXPECTED_HARNESS"
          test -z "$(git -C "$GITHUB_WORKSPACE/harness" status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code HEAD --
          printf 'source_sha=%s\nharness_sha=%s\nsource_tree=%s\nfeatures=FULL_DEFAULTS\n' "$SOURCE_SHA" "$EXPECTED_HARNESS" "$(git rev-parse HEAD^{tree})"
          sha256sum "$GITHUB_WORKSPACE/harness/.github/workflows/fork-12109-validation.yml"
          sha256sum --check <<'HASHES'
          9ab4a3de612799c163319ae3c021e42341d57b67f47e0380aa0efad2deb893fe  Cargo.lock
          e79e3cd67eb6f536bdd41d7edc9066125fe9498c47f0807645d670602aac92d4  crates/zeroclaw-runtime/src/agent/agent.rs
          75cffbecd2355e136c40fa4ca8ac4ce8d417cc3f4837b88b368659149c66869f  crates/zeroclaw-runtime/src/agent/loop_.rs
          84aed2fdada40e5f0b8e17e1fec5f6443f37df4bb9e8cdf71da2f063ce3218e2  crates/zeroclaw-runtime/src/agent/tests.rs
          HASHES
          uname -sm; nproc; free -h; df -h
          (( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') >= 7*1024*1024 )) || exit 3
      - name: Install existing CI toolchain on hosted runner only
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Toolchain and changed-file formatting
        working-directory: source
        run: |
          set -euo pipefail
          rustc --version; cargo --version; rustfmt --version
          rustfmt --edition 2024 --check --config skip_children=true crates/zeroclaw-runtime/src/agent/{agent.rs,loop_.rs,tests.rs}
      - name: Compile default-feature runtime library harness
        working-directory: source
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/12002-unit-head-target"
          test ! -e "$CARGO_TARGET_DIR"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          printf 'fresh_cargo_target=%s\n' "$CARGO_TARGET_DIR"
          cargo test --locked -p zeroclaw-runtime --lib --no-run
      - name: Discover and run all seven exact tests
        working-directory: source
        run: |
          set -euo pipefail
          tests=(
            agent::tests::auto_save_stores_only_user_messages_in_memory
            agent::tests::issue_12002_autosave_preserves_same_session
            agent::tests::issue_12002_autosave_preserves_different_sessions
            agent::tests::issue_12002_autosave_preserves_identical_inputs_and_legacy_entry
            agent::tests::issue_12002_streamed_autosave_preserves_identical_inputs
            agent::tests::issue_12002_steering_autosave_preserves_each_admitted_input
            agent::tests::auto_save_disabled_does_not_store
          )
          for test_name in "${tests[@]}"; do
            cargo test --locked -p zeroclaw-runtime --lib "$test_name" -- --exact --list | tee "$RUNNER_TEMP/discovery.log"
            grep -Fx "$test_name: test" "$RUNNER_TEMP/discovery.log"
            grep -Fx '1 test, 0 benchmarks' "$RUNNER_TEMP/discovery.log"
          done
          result=0
          for test_name in "${tests[@]}"; do
            set +e
            cargo test --locked -p zeroclaw-runtime --lib "$test_name" -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/test-result.log"
            rc=${PIPESTATUS[0]}
            set -e
            printf 'TEST_RESULT name=%s exit=%s\n' "$test_name" "$rc"
            if (( rc != 0 )); then result=1; fi
            grep -Eq '^test result: (ok|FAILED)\. [01] passed; [01] failed; 0 ignored;' "$RUNNER_TEMP/test-result.log" || result=1
            grep -Fx 'running 1 test' "$RUNNER_TEMP/test-result.log" || result=1
          done
          exit "$result"
      - name: Final pristine source attestation
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code HEAD --
          printf 'final_source_sha=%s\nfinal_source_tree=%s\n' "$SOURCE_SHA" "$(git rev-parse HEAD^{tree})"
          sha256sum --check <<'HASHES'
          9ab4a3de612799c163319ae3c021e42341d57b67f47e0380aa0efad2deb893fe  Cargo.lock
          e79e3cd67eb6f536bdd41d7edc9066125fe9498c47f0807645d670602aac92d4  crates/zeroclaw-runtime/src/agent/agent.rs
          75cffbecd2355e136c40fa4ca8ac4ce8d417cc3f4837b88b368659149c66869f  crates/zeroclaw-runtime/src/agent/loop_.rs
          84aed2fdada40e5f0b8e17e1fec5f6443f37df4bb9e8cdf71da2f063ce3218e2  crates/zeroclaw-runtime/src/agent/tests.rs
          HASHES
      - name: Final resource diagnostics
        if: always()
        run: df -h; free -h
