name: Merged 12508 focused intersection validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-12508-merged-focused-20261124
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.ref == 'refs/heads/validation/12508-merged-focused-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      SOURCE_SHA: c3bd6d2500278003e53db7c07c80a404581b9e71
      SOURCE_TREE: 82136c3b9623e0e8bd96ea47734e3194c0095090
    steps:
      - name: Checkout validation overlay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Attest frozen product and test-only overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse $SOURCE_SHA^{tree})" = "$SOURCE_TREE"
          test "$(git show -s --format=%P $SOURCE_SHA)" = 'db6fbdf1daeeb99c925678c6c7949706a91d84d8 330282cc91fb77aaab4749be397bf5b53c35958b'
          python3 - <<'PY'
          import subprocess,os,pathlib
          src=os.environ['SOURCE_SHA']
          files=['crates/zeroclaw-memory/src/qdrant.rs','crates/zeroclaw-runtime/src/agent/memory_inject.rs']
          changed=subprocess.check_output(['git','diff','--name-only',src,'HEAD'],text=True).splitlines()
          assert set(changed)==set(files+['.github/workflows/fork-12109-validation.yml'])
          for f in files:
              before=subprocess.check_output(['git','show',src+':'+f],text=True)
              after=pathlib.Path(f).read_text()
              marker=after.index('    // Validation-only')
              assert after[:marker]==before[:before.rfind('\n}')]+ '\n'
              assert after.endswith('\n}\n')
              assert '#[cfg(test)]' in after[:marker] and 'mod tests {' in after[:marker]
          print('EXACT frozen product tree',os.environ['SOURCE_TREE'],'source',src,'overlay',os.environ['GITHUB_SHA'])
          PY
          git diff --check "$SOURCE_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/evidence"
      - name: Rust pinned 1.98.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Standard hosted prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libudev-dev libasound2-dev pkg-config
          rustc +1.98.0 --version
          cargo +1.98.0 --version
          df -h .
      - name: Focused formatting
        id: fmt
        run: rustfmt +1.98.0 --edition 2024 --config skip_children=true --check crates/zeroclaw-memory/src/qdrant.rs crates/zeroclaw-runtime/src/agent/memory_inject.rs
      - name: Qdrant prompt paging timestamp and bounded work assertions
        id: qdrant
        shell: bash
        run: |
          set -euo pipefail
          for name in merged_validation_prompt_pages_preserve_rfc3339_timestamps prompt_pages_advance_over_malformed_points_embed_once_and_keep_archive prompt_work_budget_returns_partial_without_extra_requests time_bounded_recall_compares_rfc3339_instants; do
            cargo +1.98.0 test --locked -p zeroclaw-memory --lib "qdrant::tests::$name" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/$name.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/evidence/$name.log"
          done
      - name: SQLite preserved upstream failure contracts
        id: sqlite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for name in hybrid_recall_keeps_keyword_results_when_embedding_fails embedding_only_recall_still_reports_an_embedder_failure; do
            cargo +1.98.0 test --locked -p zeroclaw-memory --lib "sqlite::tests::$name" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/$name.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/evidence/$name.log"
          done
      - name: SQLite forced failure crowded prompt scope and production rendering
        id: intersection
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked -p zeroclaw-runtime --lib agent::memory_inject::tests::merged_validation_sqlite_failed_embedding_crowded_scoped_prompt -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/sqlite-intersection.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/evidence/sqlite-intersection.log"
      - name: Final integrity and required test execution
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          QDRANT: ${{ steps.qdrant.outcome }}
          SQLITE: ${{ steps.sqlite.outcome }}
          INTERSECTION: ${{ steps.intersection.outcome }}
        run: |
          test "$(git rev-parse $SOURCE_SHA^{tree})" = "$SOURCE_TREE"
          git diff --exit-code HEAD
          printf 'fmt=%s qdrant=%s sqlite=%s intersection=%s\n' "$FMT" "$QDRANT" "$SQLITE" "$INTERSECTION"
          test "$FMT/$QDRANT/$SQLITE/$INTERSECTION" = success/success/success/success
