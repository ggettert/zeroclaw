    - name: Test crates.io version-bump preflight trigger
      run: bash scripts/ci/crates_preflight_trigger.test.sh
    - name: Verify source after Test crates.io version-bump preflight trigger
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test CLI-only artifact ratchet
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test CLI-only artifact ratchet
      run: bash scripts/ci/cli_only_ratchet.test.sh
    - name: Verify source after Test CLI-only artifact ratchet
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test apt install timeout and retry behavior
