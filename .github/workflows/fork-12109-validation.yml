name: Fork 12002 required quality and native attribution
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-12002-quality-20261117
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-quality-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Checkout frozen validation harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
          submodules: false
      - name: Checkout exact reviewed fix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ggettert/zeroclaw
          ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
          path: fixed
          persist-credentials: false
          submodules: false
      - name: Verify frozen source and harness
        env:
          EXPECTED_HARNESS: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS"
          test -z "$(git -C harness status --porcelain)"
          echo "harness_sha=$EXPECTED_HARNESS features=FULL_DEFAULTS toolchain=1.98.0"
          sha256sum harness/scripts/ci/12002_gateway_acceptance.py harness/scripts/ci/12002_source_manifest.json harness/.github/workflows/fork-12109-validation.yml
          python3 harness/scripts/ci/12002_verify_sources.py
          python3 -B harness/scripts/ci/12002_gateway_acceptance.py --self-test
          free -h; df -h
      - name: Install pinned required CI toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install documented CI Linux dependencies
        run: timeout --signal=TERM --kill-after=10s 300s bash fixed/scripts/ci/apt_install.sh mold libasound2-dev libudev-dev ripgrep
      - name: Required quality, rustdoc, and native attribution
        run: bash harness/scripts/ci/12002_quality_run.sh
      - name: Final unchanged source evidence
        if: always()
        run: |
          python3 harness/scripts/ci/12002_verify_sources.py
          free -h; df -h
