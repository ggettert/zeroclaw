name: Frozen 12002 actual upstream Ubuntu checks
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: 12002-upstream-ci-20261117
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
        components: rustfmt
    - name: Verify source before Check formatting
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Verify source after Check formatting
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  repo-structure:
    name: Repository Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - name: Verify source before Guard declared submodules
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Guard declared submodules
      shell: bash
      run: "set -euo pipefail\n\ngitlinks=\"$(mktemp)\"\ndeclared=\"$(mktemp)\"\nallowed=\"$(mktemp)\"\n\ngit ls-files\
        \ -s | awk '$1 == \"160000\" { print $4 }' | sort > \"$gitlinks\"\n{ git config --file .gitmodules --get-regexp\
        \ '^submodule\\..*\\.path$' 2>/dev/null || true; } \\\n  | awk '{ print $2 }' | sort > \"$declared\"\nprintf\
        \ '%s\\n' 'docs/book/po' > \"$allowed\"\n\nif ! cmp -s \"$gitlinks\" \"$declared\"; then\n  echo \"::error::Gitlink\
        \ paths must exactly match .gitmodules paths.\"\n  echo \"Index gitlinks:\"\n  sed 's/^/  /' \"$gitlinks\"\
        \n  echo \".gitmodules paths:\"\n  sed 's/^/  /' \"$declared\"\n  exit 1\nfi\n\nif ! cmp -s \"$gitlinks\"\
        \ \"$allowed\"; then\n  echo \"::error::Unexpected submodule path. Update this guard when adding an intentional\
        \ submodule.\"\n  echo \"Allowed submodule paths:\"\n  sed 's/^/  /' \"$allowed\"\n  echo \"Actual gitlink\
        \ paths:\"\n  sed 's/^/  /' \"$gitlinks\"\n  exit 1\nfi\n"
    - name: Verify source after Guard declared submodules
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test translation release submodule handling
