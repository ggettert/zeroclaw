    - name: Verify source before Test CLI and hardware path-label ownership
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test CLI and hardware path-label ownership
      run: bash scripts/ci/path_labeler_matrix.test.sh
    - name: Verify source after Test CLI and hardware path-label ownership
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test hardware feature test-lane contract
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test hardware feature test-lane contract
      run: bash scripts/ci/hardware_feature_test_lane.test.sh
    - name: Verify source after Test hardware feature test-lane contract
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test release announcement composer
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test release announcement composer
      run: bash scripts/ci/release_post_text.test.sh
    - name: Verify source after Test release announcement composer
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test binary size report
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test binary size report
      run: bash scripts/ci/binary_size_report.test.sh
    - name: Verify source after Test binary size report
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test dependency footprint report
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test dependency footprint report
      run: bash scripts/ci/dependency_footprint.test.sh
    - name: Verify source after Test dependency footprint report
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test docs stable metadata promotion
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test docs stable metadata promotion
      run: python3 scripts/docs/promote_stable_test.py
    - name: Verify source after Test docs stable metadata promotion
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
    - name: Verify source before Test docs version selector and root 404 redirect
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test docs version selector and root 404 redirect
      run: node --test scripts/docs/version_selector_test.mjs scripts/docs/root_404_test.mjs
    - name: Verify source after Test docs version selector and root 404 redirect
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Verify source before Install system dependencies
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Install system dependencies
      run: bash scripts/ci/apt_install.sh libudev-dev ripgrep
    - name: Verify source after Install system dependencies
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Clippy runner contract tests
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Clippy runner contract tests
      run: bash scripts/ci/run_clippy.test.sh
    - name: Verify source after Clippy runner contract tests
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Clippy
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Clippy
      shell: bash
      run: "bash scripts/ci/run_clippy.sh \\\n  --scope workspace \\\n  --summary-title \"Lint diagnostics\" \\\n\
        \  --log-name cargo-clippy.log\n"
      env:
        RUST_CACHE_HIT: 'false'
    - name: Verify source after Clippy
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Rustdoc warnings gate
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
