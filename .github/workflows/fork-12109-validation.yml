name: Frozen 12002 corrective upstream Ubuntu checks
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: 12002-upstream-ci-20261117
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Verify source before Install system dependencies
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Install system dependencies
      run: bash scripts/ci/apt_install.sh libudev-dev ripgrep
    - name: Verify source after Install system dependencies
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Clippy runner contract tests
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Clippy runner contract tests
      run: bash scripts/ci/run_clippy.test.sh
    - name: Verify source after Clippy runner contract tests
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Clippy
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Clippy
      shell: bash
      run: "bash scripts/ci/run_clippy.sh \\\n  --scope workspace \\\n  --summary-title \"Lint diagnostics\" \\\n\
        \  --log-name cargo-clippy.log\n"
      env:
        RUST_CACHE_HIT: 'false'
    - name: Verify source after Clippy
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Rustdoc warnings gate
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Rustdoc warnings gate
      run: cargo doc --no-deps --workspace --exclude zeroclaw-desktop
    - name: Verify source after Rustdoc warnings gate
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Comment hygiene gate (no issue refs / review notes / truncation artifacts)
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Comment hygiene gate (no issue refs / review notes / truncation artifacts)
      run: 'bash scripts/ci/comment_hygiene_gate.test.sh

        bash scripts/ci/comment_hygiene_gate.sh

        '
    - name: Verify source after Comment hygiene gate (no issue refs / review notes / truncation artifacts)
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Container build inputs gate (root build.rs reaches every source build)
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Container build inputs gate (root build.rs reaches every source build)
      run: 'bash scripts/ci/container_build_inputs_gate.test.sh

        bash scripts/ci/container_build_inputs_gate.sh

        '
    - name: Verify source after Container build inputs gate (root build.rs reaches every source build)
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before act-local artifact compatibility tests
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: act-local artifact compatibility tests
      run: bash scripts/dev/act-local.test.sh
    - name: Verify source after act-local artifact compatibility tests
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  build:
    name: ${{ matrix.label }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          cmd: build
          label: Build
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
        targets: ${{ matrix.target }}
    - name: Verify source before Install Linux system dependencies
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
      if: runner.os == 'Linux'
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: bash scripts/ci/apt_install.sh mold libasound2-dev
    - name: Verify source after Install Linux system dependencies
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      shell: bash
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before ${{ matrix.label }}
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: ${{ matrix.label }}
      shell: bash
      run: "set +e\ncargo_log=\"${RUNNER_TEMP}/cargo-build-${{ matrix.target }}.log\"\nSECONDS=0\ncargo ${{ matrix.cmd\
        \ }} --profile ci --locked --target ${{ matrix.target }} 2>&1 | tee \"$cargo_log\"\ncargo_status=${PIPESTATUS[0]}\n\
        duration_seconds=$SECONDS\nset -e\n\nworkspace_path_compiles=\"$(grep -E -c 'Compiling.*\\([^)]*zeroclaw'\
        \ \"$cargo_log\" || true)\"\ntotal_compiles=\"$(grep -c 'Compiling' \"$cargo_log\" || true)\"\ndownloaded_crates=\"\
        $(grep -c 'Downloaded' \"$cargo_log\" || true)\"\ncache_hit=\"${RUST_CACHE_HIT:-unknown}\"\nsummary_file=\"\
        ${GITHUB_STEP_SUMMARY:-/dev/null}\"\n\n{\n  echo \"### ${{ matrix.label }} diagnostics: ${{ matrix.target\
        \ }}\"\n  echo \"\"\n  echo \"| Field | Value |\"\n  echo \"| --- | --- |\"\n  echo \"| Target | \\`${{\
        \ matrix.target }}\\` |\"\n  echo \"| Runner OS | \\`${{ runner.os }}\\` |\"\n  echo \"| Rust cache exact\
        \ hit | \\`${cache_hit}\\` |\"\n  echo \"| Cargo duration | \\`${duration_seconds}s\\` |\"\n  echo \"| Cargo\
        \ status | \\`${cargo_status}\\` |\"\n  echo \"| Workspace path compile lines | \\`${workspace_path_compiles}\\\
        ` |\"\n  echo \"| Total compile lines | \\`${total_compiles}\\` |\"\n  echo \"| Downloaded crate lines |\
        \ \\`${downloaded_crates}\\` |\"\n} >> \"$summary_file\"\n\nexit \"$cargo_status\"\n"
      env:
        RUST_CACHE_HIT: 'false'
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    - name: Verify source after ${{ matrix.label }}
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check voice-wake
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
      if: runner.os != 'Linux'
    - name: Check voice-wake
      if: runner.os != 'Linux'
      shell: bash
      run: cargo check --locked -p zeroclaw-channels --no-default-features --features voice-wake --target ${{ matrix.target
        }}
    - name: Verify source after Check voice-wake
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test voice-wake
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
      if: runner.os == 'Linux'
    - name: Test voice-wake
      if: runner.os == 'Linux'
      shell: bash
      run: cargo test --locked -p zeroclaw-channels --no-default-features --features voice-wake --target ${{ matrix.target
        }} --lib voice_wake
      env:
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    - name: Verify source after Test voice-wake
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  check:
    name: Check (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: no default features
          cache-key: check
          args: --workspace --exclude zeroclaw-desktop --no-default-features
          sys_deps: ''
          rustflags: -D warnings
        - name: default features, all targets
          cache-key: check-all-targets
          args: --workspace --exclude zeroclaw-desktop --all-targets
          sys_deps: ''
          rustflags: -D warnings
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
    - name: Verify source before Install system dependencies
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
      if: matrix.sys_deps != ''
    - name: Install system dependencies
      if: matrix.sys_deps != ''
      run: bash scripts/ci/apt_install.sh ${{ matrix.sys_deps }}
    - name: Verify source after Install system dependencies
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check
      run: cargo check --locked ${{ matrix.args }}
    - name: Verify source after Check
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  installer-drift:
    name: Installer Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      all_features: ${{ steps.all_features.outputs.value }}
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - name: Verify source before Test installer target detection
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test installer target detection
      run: bash scripts/ci/install_target_triple_test.sh
    - name: Verify source after Test installer target detection
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Test installer CLI package-version parsing
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Test installer CLI package-version parsing
      run: bash scripts/ci/install_cli_package_version_test.sh
    - name: Verify source after Test installer CLI package-version parsing
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
    - name: Verify source before Check generated install surfaces are in sync with the spec
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check generated install surfaces are in sync with the spec
      run: cargo generate installers --check
    - name: Verify source after Check generated install surfaces are in sync with the spec
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check source-backed SOP syntax reference
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check source-backed SOP syntax reference
      run: cargo generate sop-syntax --check
    - name: Verify source after Check source-backed SOP syntax reference
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check the OpenRPC contract matches zeroclaw-rpc-proto
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check the OpenRPC contract matches zeroclaw-rpc-proto
      run: cargo generate openrpc --check
    - name: Verify source after Check the OpenRPC contract matches zeroclaw-rpc-proto
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Resolve canonical all-feature selection
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Resolve canonical all-feature selection
      id: all_features
      run: "set -euo pipefail\nvalue=\"$(cargo generate features --selection all)\"\nif [ -z \"$value\" ]; then\n\
        \  echo \"::error::canonical all-feature selection is empty\"\n  exit 1\nfi\nprintf 'value=%s\\n' \"$value\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Verify source after Resolve canonical all-feature selection
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  msrv:
    name: MSRV (declared floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117' && needs.installer-drift.result
      == 'success'
    needs:
    - installer-drift
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - name: Verify source before Resolve declared MSRV
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Resolve declared MSRV
      id: msrv
      shell: bash
      run: "set -euo pipefail\nmsrv=\"$(sed -n 's/^rust-version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -1)\"\
        \nif [[ ! \"$msrv\" =~ ^[0-9]+\\.[0-9]+(\\.[0-9]+)?$ ]]; then\n  echo \"::error::could not read [workspace.package]\
        \ rust-version from Cargo.toml (got '${msrv}')\"\n  exit 1\nfi\necho \"version=$msrv\" >> \"$GITHUB_OUTPUT\"\
        \necho \"Declared MSRV: $msrv\"\n"
    - name: Verify source after Resolve declared MSRV
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - name: Verify source before Install system dependencies
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Install system dependencies
      run: bash scripts/ci/apt_install.sh libudev-dev
    - name: Verify source after Install system dependencies
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check at the declared MSRV
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check at the declared MSRV
      run: "cargo check --locked --workspace --exclude zeroclaw-desktop \\\n  --no-default-features \\\n  --features\
        \ \"${{ needs.installer-drift.outputs.all_features }}\"\n"
    - name: Verify source after Check at the declared MSRV
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  check-32bit:
    name: Check (32-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Preserve independent source verifier
      run: 'test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"

        cp scripts/ci/12002_ci_verify.py "$RUNNER_TEMP/12002_ci_verify.py"

        cp scripts/ci/12002_ci_verify.json "$RUNNER_TEMP/12002_ci_verify.json"'
    - name: Checkout exact unchanged contribution
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ggettert/zeroclaw
        ref: a1780d236088e782caaebc0a84dd4c9f19c04d2d
        fetch-depth: 0
        persist-credentials: false
    - name: Verify initial source identity
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" initial
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.98.0
        targets: i686-unknown-linux-gnu
    - name: Verify source before Install 32-bit system libraries
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Install 32-bit system libraries
      run: bash scripts/ci/apt_install.sh gcc-multilib
    - name: Verify source after Install 32-bit system libraries
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Ensure web/dist placeholder exists
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Ensure web/dist placeholder exists
      run: mkdir -p web/dist && touch web/dist/.gitkeep
    - name: Verify source after Ensure web/dist placeholder exists
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
    - name: Verify source before Check (32-bit, no default features)
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" before
    - name: Check (32-bit, no default features)
      run: cargo check --locked --target i686-unknown-linux-gnu --no-default-features
    - name: Verify source after Check (32-bit, no default features)
      if: always()
      run: python3 "$RUNNER_TEMP/12002_ci_verify.py" after
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/validation/12002-upstream-ci-20261117'
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
