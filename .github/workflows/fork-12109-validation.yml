name: Fork 12002 autosave reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-12002-reproduction
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.repository == 'ggettert/zeroclaw' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.98.0
      UPSTREAM_BASE: 6e83982340297d4682c5399792549ee9e2f275f0
      FORK_BEFORE_SYNC: e2ea0c8a5ac20c82321fcbdfff26f080c45b0f7d
    steps:
      - name: Checkout this reviewed workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ggettert/zeroclaw
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify source identity and resources
        env:
          EXPECTED_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'source_and_workflow=%s\nupstream_base=%s\nfork_before_sync=%s\n' "$EXPECTED_SHA" "$UPSTREAM_BASE" "$FORK_BEFORE_SYNC"
          git status --short
          sha256sum Cargo.lock crates/zeroclaw-runtime/src/agent/tests.rs .github/workflows/fork-12109-validation.yml
          uname -sm; nproc; free -h; df -h
          (( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') >= 7*1024*1024 )) || exit 3
      - name: Install existing CI toolchain on hosted runner only
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Toolchain and changed-file formatting
        run: |
          set -euo pipefail
          rustc --version; cargo --version; rustfmt --version
          rustfmt --edition 2024 --check --config skip_children=true crates/zeroclaw-runtime/src/agent/tests.rs
      - name: Compile default-feature runtime library harness
        run: cargo test --locked -p zeroclaw-runtime --lib --no-run
      - name: Discover and run all three exact tests
        run: |
          set -euo pipefail
          tests=(
            agent::tests::auto_save_stores_only_user_messages_in_memory
            agent::tests::issue_12002_autosave_preserves_same_session
            agent::tests::issue_12002_autosave_preserves_different_sessions
          )
          for test_name in "${tests[@]}"; do
            cargo test --locked -p zeroclaw-runtime --lib "$test_name" -- --exact --list | tee "$RUNNER_TEMP/discovery.log"
            grep -Fx "$test_name: test" "$RUNNER_TEMP/discovery.log"
            grep -Fx '1 test, 0 benchmarks' "$RUNNER_TEMP/discovery.log"
          done
          result=0
          for test_name in "${tests[@]}"; do
            set +e
            cargo test --locked -p zeroclaw-runtime --lib "$test_name" -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/test-result.log"
            rc=${PIPESTATUS[0]}
            set -e
            printf 'TEST_RESULT name=%s exit=%s\n' "$test_name" "$rc"
            if (( rc != 0 )); then result=1; fi
            grep -Eq '^test result: (ok|FAILED)\. [01] passed; [01] failed; 0 ignored;' "$RUNNER_TEMP/test-result.log" || result=1
            grep -Fx 'running 1 test' "$RUNNER_TEMP/test-result.log" || result=1
          done
          exit "$result"
      - name: Final resource diagnostics
        if: always()
        run: df -h; free -h
